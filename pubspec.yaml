name: flutter_app
description: "Offline mango leaf disease detection with on-device TensorFlow Lite."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  camera: ^0.12.1
  image_picker: ^1.2.3
  tflite_flutter: ^0.12.1
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/mango_disease_int8.tflite
    - assets/models/leaf_non_leaf.tflite
    - assets/data/class_names.json
    - assets/data/treatment_data.json
